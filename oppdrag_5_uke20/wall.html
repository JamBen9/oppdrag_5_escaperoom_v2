<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegg</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-scene="wall">
    <div class="scene">
        <img class="background" src="img/vegg.jpg" alt="veggen i rommet">
        <div class="overlay">
            <button type="button" class="hitbox wall-hitbox" data-action="break-wall" title="Sjekk veggen"></button>
            <a class="arrow arrow-left" href="kim.html" title="Tilbake til uteområdet">
                <img src="img/venstre-arrow.png" alt="venstre pil">
            </a>
        </div>
    </div>
    <button id="restart-game" class="restart-button">Start på nytt</button>
    <div id="message" class="game-message"></div>
    <script src="script.js"></script>
</body>
</html>
