<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Kodel�s</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-scene="keypad">
    <div class="scene">
        <div class="background background-dark"></div>
        <div class="overlay">
            <div class="keypad">
                <div id="keypad-display" class="keypad-display">____</div>
                <div class="keypad-row">
                    <button type="button" class="keypad-button" data-digit="1">1</button>
                    <button type="button" class="keypad-button" data-digit="2">2</button>
                    <button type="button" class="keypad-button" data-digit="3">3</button>
                </div>
                <div class="keypad-row">
                    <button type="button" class="keypad-button" data-digit="4">4</button>
                    <button type="button" class="keypad-button" data-digit="5">5</button>
                    <button type="button" class="keypad-button" data-digit="6">6</button>
                </div>
                <div class="keypad-row">
                    <button type="button" class="keypad-button" data-digit="7">7</button>
                    <button type="button" class="keypad-button" data-digit="8">8</button>
                    <button type="button" class="keypad-button" data-digit="9">9</button>
                </div>
                <div class="keypad-row">
                    <button type="button" class="keypad-button" data-action="keypad-clear">C</button>
                    <button type="button" class="keypad-button" data-digit="0">0</button>
                    <button type="button" class="keypad-button" data-action="keypad-enter">OK</button>
                </div>
            </div>
            <a class="arrow arrow-left" href="kim.html" title="Tilbake til uteområdet">
                <img src="img/venstre-arrow.png" alt="venstre pil">
            </a>
        </div>
    </div>
    <button id="restart-game" class="restart-button">Start på nytt</button>
    <div id="message" class="game-message"></div>
    <script src="script.js"></script>
</body>
</html>
