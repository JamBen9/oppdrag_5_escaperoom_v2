<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Hull</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-scene="hull">
    <div class="scene">
        <img class="background" src="img/hull_vegg.jpg" alt="hull i vegg">
        <div class="overlay">
            <button type="button" class="hitbox hull-hitbox" data-action="go-ending" title="Sjekk hullet"></button>
            <a class="arrow arrow-left" href="wall.html" title="Tilbake til veggen">
                <img src="img/venstre-arrow.png" alt="venstre pil">
            </a>
        </div>
    </div>
    <button id="restart-game" class="restart-button">Start på nytt</button>
    <div id="message" class="game-message"></div>
    <script src="script.js"></script>
</body>
</html>
