<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uteområde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-scene="kim">
    <div class="scene">
        <img class="background" src="img/Outside_kim.jpg" alt="uteområde">
        <div class="overlay">
            <a class="hitbox kim-door-hitbox" href="keypad.html" title="Gå til kodelås"></a>
            <img class="overlay-icon kim-door" src="img/door.PNG" alt="dør til kodelås">
            <a class="arrow arrow-left" href="door.html" title="Tilbake til cellen">
                <img src="img/venstre-arrow.png" alt="venstre pil">
            </a>
            <a class="arrow arrow-right" href="wall.html" title="Gå til veggen">
                <img src="img/hoyre-arrow.png" alt="høyre pil">
            </a>
        </div>
    </div>
    <button id="restart-game" class="restart-button">Start på nytt</button>
    <div id="message" class="game-message"></div>
    <script src="script.js"></script>
</body>
</html>
